services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mountain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mountain}
      POSTGRES_DB: ${POSTGRES_DB:-mountain}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mountain} -d ${POSTGRES_DB:-mountain}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mountain}:${POSTGRES_PASSWORD:-mountain}@db:5432/${POSTGRES_DB:-mountain}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # 認証（Microsoft 365 / Entra ID）：DFは dev（既定ユーザー）、本番は entra に切替え
      AUTH_MODE: ${AUTH_MODE:-dev}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_API_CLIENT_ID: ${ENTRA_API_CLIENT_ID:-}
      ENTRA_SPA_CLIENT_ID: ${ENTRA_SPA_CLIENT_ID:-}
      ENTRA_API_SCOPE: ${ENTRA_API_SCOPE:-}
      ENTRA_GROUP_USERS: ${ENTRA_GROUP_USERS:-}
      ENTRA_GROUP_ADMINS: ${ENTRA_GROUP_ADMINS:-}
      ENTRA_ADMIN_UPNS: ${ENTRA_ADMIN_UPNS:-}
      ENTRA_AUTO_PROVISION: ${ENTRA_AUTO_PROVISION:-True}
      # SIP / WebRTC（ブラウザ内ソフトフォン → 本番PBX）
      SIP_WSS_URL: ${SIP_WSS_URL:-}
      SIP_REALM: ${SIP_REALM:-}
      SIP_STUN: ${SIP_STUN:-stun:stun.l.google.com:19302}
      SIP_OUTBOUND_PREFIXES: ${SIP_OUTBOUND_PREFIXES:-}
      # capis（FreePBX 自作API）
      CTI_API_URL: ${CTI_API_URL:-}
      CTI_API_KEY: ${CTI_API_KEY:-}
      CTI_CALLBACK_TOKEN: ${CTI_CALLBACK_TOKEN:-}
      CTI_API_VERIFY_TLS: ${CTI_API_VERIFY_TLS:-False}
      # CTI（電話）：DFは simulator、本番は pbx に切替え + CTI_PBX_* を構成
      CTI_PROVIDER: ${CTI_PROVIDER:-simulator}
      CTI_PBX_HOST: ${CTI_PBX_HOST:-}
      CTI_PBX_PORT: ${CTI_PBX_PORT:-0}
      CTI_PBX_USERNAME: ${CTI_PBX_USERNAME:-}
      CTI_PBX_SECRET: ${CTI_PBX_SECRET:-}
      CTI_RECORDING_DIR: ${CTI_RECORDING_DIR:-/var/mountain/recordings}
      # モックデータの自動初期化（DF専用：毎日決まった時刻に初期状態へ戻す）。本番は未設定＝無効。
      MOCK_RESET_ENABLED: ${MOCK_RESET_ENABLED:-}
      MOCK_RESET_AT: ${MOCK_RESET_AT:-00:00}
      # 入力補助：法人番号→企業情報（gBizINFO）のAPIトークン。空欄なら法人番号検索のみ無効。
      GBIZ_API_TOKEN: ${GBIZ_API_TOKEN:-}
      # 本番導入セットアップ：初回起動時に土台データ（区分マスタ・権限・ロール・アナウンス定義・システム利用者）を
      # 自動投入する。既定 True。DFは土台投入済みのため no-op、本番は空DBから自動構成される。
      AUTO_PROVISION_ENABLED: ${AUTO_PROVISION_ENABLED:-True}
      # 機微情報（口座番号・カード番号・CVV）の暗号鍵。空なら開発用の既定鍵を使用。
      # 本番は初回データ投入前に強固な鍵を設定する（DF≡Prod：コード同一・鍵のみ環境差）。
      SENSITIVE_ENC_KEY: ${SENSITIVE_ENC_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db_data:
