server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # アップロード上限。既定(1MB)だとアナウンス音声等で 413 になるため緩和。
    # 前段(443)プロキシと同値の 50m。実際のサイズ上限はアプリ側(10MB)が判定し、
    # 超過時は日本語の案内(422)を返す。
    client_max_body_size 50m;

    # API はバックエンド(api コンテナ)へ中継
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ハッシュ付きの静的アセット(JS/CSS等)はファイル名が毎回変わるため長期キャッシュ可
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: 実体のないパスは index.html へ
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html は常に最新を取得させる(古い画面=デザイン崩れの残留を防ぐ)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }
}
